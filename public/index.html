    <title>TalentBD | Learn, Verify & Earn ৳</title>

    <style>
      /* INITIAL PRE-LOADER STYLE: Glassmorphism Theme */
      body {
        margin: 0;
        background-color: #f8fafc;
        font-family: 'Inter', sans-serif;
      }
      #root:empty {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top right, #eef2ff, #f8fafc);
      }
      #root:empty::after {
        content: "";
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; background: #fee2e2; color: #dc2626; font-weight: bold;">
        You need to enable JavaScript to run TalentBD. Your wallet and learning progress require a secure JS connection.
      </div>
    </noscript>

    <div id="root"></div>

    </body>
