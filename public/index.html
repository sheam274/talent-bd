    <title>TalentBD | Learn, Verify & Earn ৳</title>

    <style>
      /* --- ⚡ EMERGENCY PRE-LOADER --- 
         Renders instantly while the React bundle downloads. 
         Designed to match the 2026 'Slate & Blue' aesthetic.
      */
      body {
        margin: 0;
        background-color: #f8fafc;
        font-family: 'Inter', -apple-system, sans-serif;
        overflow-x: hidden;
      }

      #root:empty {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top right, #f1f5f9, #f8fafc);
      }

      /* Logo Placeholder */
      #root:empty::before {
        content: "TALENTBD";
        position: absolute;
        bottom: 15%;
        font-weight: 950;
        letter-spacing: 0.1em;
        color: #e2e8f0;
        font-size: 0.85rem;
        text-transform: uppercase;
      }

      /* Neural Spinner */
      #root:empty::after {
        content: "";
        width: 54px;
        height: 54px;
        border: 4px solid #f1f5f9;
        border-top: 4px solid #2563eb;
        border-right: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 0.7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.2));
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Mobile Safe Areas */
      @supports (padding: env(safe-area-inset-top)) {
        .App {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 40px; text-align: center; background: #fff1f2; color: #9f1239; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; border-top: 8px solid #be123c;">
        <h1 style="font-weight: 950; margin-bottom: 16px; letter-spacing: -1px;">Access Restricted</h1>
        <p style="max-width: 450px; line-height: 1.7; font-weight: 500; color: #4b5563;">
          TalentBD uses <span style="color: #be123c; font-weight: 700;">Military-Grade Neural Encryption</span> to secure your Wallet and MFS (bKash/Nagad) transactions. 
          <br><br>
          Please enable <strong>JavaScript</strong> in your browser settings to verify your identity and start earning.
        </p>
      </div>
    </noscript>

    <div id="root"></div>

    </body>
