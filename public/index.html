    <title>TalentBD | Learn, Verify & Earn ৳</title>

    <style>
      /* --- EMERGENCY PRE-LOADER --- 
         This renders instantly while the main React bundle (~200kb+) downloads.
      */
      body {
        margin: 0;
        background-color: #f8fafc;
        font-family: 'Inter', -apple-system, sans-serif;
        overflow-x: hidden;
      }

      #root:empty {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top right, #eef2ff, #f8fafc);
      }

      #root:empty::before {
        content: "TalentBD";
        position: absolute;
        bottom: 20%;
        font-weight: 950;
        letter-spacing: -2px;
        color: #cbd5e1;
        font-size: 1.5rem;
        text-transform: uppercase;
      }

      #root:empty::after {
        content: "";
        width: 48px;
        height: 48px;
        border: 5px solid #e2e8f0;
        border-top: 5px solid #2563eb;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.1);
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 30px; text-align: center; background: #fef2f2; color: #991b1b; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1 style="font-weight: 900; margin-bottom: 10px;">JavaScript Required</h1>
        <p style="max-width: 400px; line-height: 1.6;">
          TalentBD uses secure encryption for your <strong>Wallet</strong> and <strong>MFS transactions</strong>. 
          Please enable JavaScript in your browser settings to continue.
        </p>
      </div>
    </noscript>

    <div id="root"></div>

    </body>
